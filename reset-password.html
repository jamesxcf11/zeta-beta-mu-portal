<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Zeta Beta Mu Fraternity</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.min.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white font-sans text-[var(--zbm-forest)] p-4">
  <main class="w-full max-w-md space-y-5">
    <h1 class="text-3xl font-semibold">Set a new password</h1>
    <p id="status" class="text-sm opacity-80">Verifying your reset link...</p>
    <form id="reset-form" class="space-y-4 hidden">
      <label for="password" class="block text-sm font-medium">New password</label>
      <input type="password" id="password" required minlength="8" autocomplete="new-password" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-[var(--zbm-forest)]">
      <label for="confirm" class="block text-sm font-medium">Confirm password</label>
      <input type="password" id="confirm" required minlength="8" autocomplete="new-password" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-[var(--zbm-forest)]">
      <button type="submit" id="submit-btn" class="w-full rounded-xl py-3 font-semibold bg-[var(--zbm-forest)] text-white">Update password</button>
    </form>
    <a href="login.html" class="text-sm underline">Back to sign in</a>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const form = document.getElementById('reset-form');

    function ready() {
      statusEl.textContent = 'Choose a new password for your account.';
      form.classList.remove('hidden');
    }

    db.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') ready(); });
    setTimeout(async () => {
      const { data } = await db.auth.getSession();
      if (!data.session && form.classList.contains('hidden')) {
        statusEl.textContent = 'This reset link is invalid or has expired. Request a new one from the sign in page.';
      }
    }, 3000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      if (password.length < 8) { statusEl.textContent = 'Password must be at least 8 characters.'; return; }
      if (password !== document.getElementById('confirm').value) { statusEl.textContent = 'Passwords do not match.'; return; }
      document.getElementById('submit-btn').disabled = true;
      const { error } = await db.auth.updateUser({ password });
      if (error) {
        statusEl.textContent = error.message || 'Could not update password.';
        document.getElementById('submit-btn').disabled = false;
        return;
      }
      await db.auth.signOut();
      statusEl.textContent = 'Password updated. Redirecting to sign in...';
      form.classList.add('hidden');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>
</body>
</html>
