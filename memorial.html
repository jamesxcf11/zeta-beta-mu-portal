<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zeta Beta Mu Fraternity - Tribute">
  <title>In Memoriam | Zeta Beta Mu Fraternity</title>

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" integrity="sha384-8nT3SpButyvenpAdKYPJzXdSz3zidMGduMoaMvwjKnAWVv238n6P1mhveiJJQWrV" crossorigin="anonymous"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.min.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body class="dark-theme memoriam-solemn">

  <!-- NAVIGATION BAR -->
  <nav class="landing-navbar" style="opacity: 1; transform: translateY(0);">
    <div class="landing-navbar-inner">
      <a href="memoriam.html" class="landing-navbar-logo">
        <div class="landing-navbar-logo-icon">
          <img src="image/logo1.png" alt="ZBM Logo" class="landing-logo-img">
        </div>
        <span class="font-serif font-semibold text-lg">Zeta Beta Mu</span>
      </a>
      <div class="landing-navbar-actions">
        <button class="navbar-theme-toggle" type="button" aria-label="Toggle dark mode">
          <i data-lucide="sun" class="navbar-theme-icon navbar-theme-icon-sun"></i>
          <i data-lucide="moon" class="navbar-theme-icon navbar-theme-icon-moon"></i>
        </button>
        <a href="memoriam.html" class="btn btn-glass btn-sm internal-link">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Back to In Memoriam
        </a>
      </div>
    </div>
  </nav>

  <!-- TRIBUTE HEADER -->
  <section class="landing-section" style="padding-top: 120px;">
    <div class="memorial-container">

      <header class="memorial-hero glass-card">
        <!-- Populated by MemorialModule.renderHero() -->
      </header>

      <!-- TWO COLUMN: Tribute wall + Gallery -->
      <div class="memorial-layout">

        <!-- Tribute Wall -->
        <div class="memorial-main">
          <h2 class="memorial-section-title">
            <i data-lucide="message-square-heart" class="w-5 h-5"></i>
            Tribute Wall
          </h2>

          <div id="tribute-wall">
            <!-- Populated by MemorialModule.renderTributeWall() -->
          </div>
        </div>

        <!-- Photo / Video Gallery -->
        <aside class="memorial-side">
          <h2 class="memorial-section-title">
            <i data-lucide="images" class="w-5 h-5"></i>
            Photos &amp; Videos
          </h2>
          <div id="memorial-gallery" class="memorial-gallery">
            <!-- Populated by MemorialModule.renderGallery() -->
          </div>
          <p class="landing-muted-text text-sm mt-4">
            <i data-lucide="info" class="w-4 h-4 inline-block mr-1 align-middle"></i>
            Brothers will be able to upload photos and videos here.
          </p>
        </aside>

      </div>
    </div>
  </section>


  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/memorial.js"></script>
  <script>
    lucide.createIcons();
  </script>

  <!-- Dev Inspector -->
  <script src="js/dev-inspector.js"></script>

</body>
</html>
