<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="All Announcements - Zeta Beta Mu Fraternity">
  <title>All Announcements | Zeta Beta Mu Fraternity</title>

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" integrity="sha384-8nT3SpButyvenpAdKYPJzXdSz3zidMGduMoaMvwjKnAWVv238n6P1mhveiJJQWrV" crossorigin="anonymous"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.min.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body class="dark-theme">

  <header class="mobile-header">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg flex items-center justify-center">
        <img src="image/logo1.png" alt="ZBM Logo" class="w-10 h-10 object-contain">
      </div>
      <span class="font-serif text-lg font-semibold">Zeta Beta Mu</span>
    </div>
    <button class="navbar-theme-toggle" type="button" aria-label="Toggle dark mode">
      <i data-lucide="sun" class="navbar-theme-icon navbar-theme-icon-sun"></i>
      <i data-lucide="moon" class="navbar-theme-icon navbar-theme-icon-moon"></i>
    </button>
    <button id="hamburger-menu" class="hamburger" aria-expanded="false" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div id="mobile-overlay" class="mobile-overlay"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-logo" title="Est. 1971 &middot; Medical Fraternity">
      <div class="sidebar-logo-icon">
        <img src="image/logo1.png" alt="ZBM Logo">
      </div>
      <div class="sidebar-logo-text">
        <span class="sidebar-logo-title">Zeta Beta <em>Mu</em></span>
      </div>
      <button id="sidebar-collapse" class="sidebar-collapse" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
        <i data-lucide="chevrons-left"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <a href="home.html#feed" class="nav-link" title="Feed">
          <i data-lucide="home"></i>
          <span>Feed</span>
        </a>
        <a href="directory.html" class="nav-link" title="Directory">
          <i data-lucide="stethoscope"></i>
          <span>Directory</span>
        </a>
      </div>
      <div class="nav-group">
        <a href="traditions.html" class="nav-link" title="Traditions">
          <i data-lucide="book-open"></i>
          <span>Traditions</span>
        </a>
        <a href="vault.html" class="nav-link" title="Vault">
          <i data-lucide="archive"></i>
          <span>Vault</span>
        </a>
        <a href="merchandise.html" class="nav-link" title="Merchandise">
          <i data-lucide="shopping-bag"></i>
          <span>Merchandise</span>
        </a>
      </div>
      <div class="nav-group">
        <a href="memoriam.html" class="nav-link" title="In Memoriam">
          <i data-lucide="flame"></i>
          <span>In Memoriam</span>
        </a>
      </div>
      <div class="nav-section-divider"><span class="nav-section-mark">&#9670;</span> Officer Controls</div>
      <a href="admin.html" class="nav-link nav-link-officer" id="officer-tools-link" title="Officer Tools">
        <i data-lucide="shield"></i>
        <span>Officer Tools</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" id="user-card" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-label="Open profile menu">
        <img id="user-avatar" src="image/placeholders/avatars/a11.jpg" alt="User" class="user-avatar">
        <div class="user-info">
          <div id="user-name" class="user-name">Dr. James Anderson</div>
          <div class="user-role">Administrator · Class of 2005</div>
        </div>
      </div>

      <div class="profile-dropdown" id="profile-dropdown" aria-hidden="true">
        <a href="profile.html" class="profile-dropdown-item">View Profile</a>
        <a href="settings.html" class="profile-dropdown-item">Settings</a>
        <div class="profile-dropdown-divider"></div>
        <button class="profile-dropdown-item profile-dropdown-danger" id="profile-logout">Log Out</button>
      </div>
    </div>
  </aside>

  <main id="main-content" class="main-content">
    <section class="screen active">
      <header class="top-header mb-8">
        <h1 class="header-title">All Announcements</h1>
        <div class="header-actions">
          <a href="home.html#feed" class="btn btn-glass">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Feed
          </a>
        </div>
      </header>

      <div class="feed-layout">
        <div class="feed-main">
          <div id="announcements-full-list" class="full-list widget-list">
            <!-- Full announcements list rendered dynamically -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" title="Back to top">
    <i data-lucide="chevron-up" class="w-6 h-6"></i>
  </button>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/main.js"></script>
  <script src="js/feed.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof FeedModule !== 'undefined') {
        FeedModule.renderAnnouncementsFullList();
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>

  <script>
    (function () {
      const sidebar = document.getElementById('sidebar');
      const collapseBtn = document.getElementById('sidebar-collapse');
      if (!sidebar || !collapseBtn) return;

      collapseBtn.addEventListener('click', function () {
        const collapsed = sidebar.classList.toggle('is-collapsed');
        const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        collapseBtn.setAttribute('aria-label', label);
        collapseBtn.setAttribute('title', label);
        const iconName = collapsed ? 'chevrons-right' : 'chevrons-left';
        collapseBtn.innerHTML = '<i data-lucide="' + iconName + '"></i>';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      });
    })();
  </script>

</body>
</html>
