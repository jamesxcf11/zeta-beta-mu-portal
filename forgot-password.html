<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Zeta Beta Mu Fraternity</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.min.css?v=17">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/turnstile.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white font-sans text-[var(--zbm-forest)] p-4">
  <main class="w-full max-w-md space-y-5">
    <h1 class="text-3xl font-semibold">Reset your password</h1>
    <p class="text-sm opacity-80">Enter the email you registered with and we'll send you a reset link.</p>
    <form id="forgot-form" class="space-y-4">
      <label for="email" class="block text-sm font-medium">Email</label>
      <input type="email" id="email" required autocomplete="email" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-[var(--zbm-forest)]">
      <div id="turnstile-widget"></div>
      <button type="submit" id="submit-btn" class="w-full rounded-xl py-3 font-semibold bg-[var(--zbm-forest)] text-white">Send reset link</button>
    </form>
    <p id="message" class="text-sm" role="status" aria-live="polite"></p>
    <a href="login.html" class="text-sm underline">Back to sign in</a>
  </main>
  <script>
    ZBMTurnstile.mount(document.getElementById('turnstile-widget'));
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');
      btn.disabled = true;
      const email = document.getElementById('email').value.trim();
      const redirectTo = new URL('reset-password.html', window.location.href).href;
      const captchaToken = ZBMTurnstile.token();
      if (ZBMTurnstile.enabled() && !captchaToken) {
        btn.disabled = false;
        msg.textContent = 'Please complete the human verification check.';
        return;
      }
      const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo, ...(captchaToken ? { captchaToken } : {}) });
      ZBMTurnstile.reset();
      btn.disabled = false;
      // Same message either way so account existence is not revealed.
      msg.textContent = error && /rate limit/i.test(error.message || '')
        ? 'Too many requests. Please wait a few minutes and try again.'
        : 'If an account exists for that email, a reset link is on its way.';
    });
  </script>
</body>
</html>
